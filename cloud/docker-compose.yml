services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emby
      POSTGRES_PASSWORD: emby
      POSTGRES_DB: emby_cloud
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port mapping: Postgres stays on the internal compose network only
    # (safer; also avoids colliding with any other Postgres on the host).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emby -d emby_cloud"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override to point at the compose db service.
      DATABASE_URL: postgres://emby:emby@db:5432/emby_cloud
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host port configurable via APP_PORT (default 8080); set APP_PORT=8090 on
      # hosts where 8080 is taken.
      - "${APP_PORT:-8080}:8080"
    # One-shot: apply schema + ensure admin, then start the API.
    command: sh -c "npm run migrate && npm run seed:admin && npm start"

volumes:
  pgdata:
