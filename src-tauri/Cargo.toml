[package]
name = "emby-player"
version = "0.1.0"
description = "An iOS-styled Emby/Jellyfin desktop client with MPV core."
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "emby_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

# Async runtime / networking
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = "0.3"
async-trait = "0.1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time & uuid
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MPV embedded (optional, gated)
libmpv2 = { version = "4", optional = true }

# Window visual effects (Mica/Acrylic on Windows, Vibrancy on macOS)
window-vibrancy = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Media",
  "Media_Playback",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
] }

# URL parsing
url = "2.5"

# Open URLs and local paths from the frontend.
open = "5"

# Concurrency utilities
parking_lot = "0.12"
dashmap = "6"

[features]
default = ["mpv-ipc"]
mpv-embedded = ["dep:libmpv2"]
mpv-ipc = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
